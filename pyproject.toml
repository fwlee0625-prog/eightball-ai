[project]
name = "eightball-ai"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = ["fastapi", "uvicorn"]

[dependency-groups]
dev = ["httpx", "pytest", "ruff", "jsonschema"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["apps/api/tests", "python/billiards_core/tests"]
pythonpath = ["apps/api", "python/billiards_core"]

[tool.ruff]
target-version = "py312"
line-length = 100
include = ["apps/api/**/*.py", "python/**/*.py"]

# Explicit initial baseline; do not inherit a developer's global lint preferences.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
